name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: git identity for throwaway test repos
        run: |
          git config --global user.email ci@example.com
          git config --global user.name ci
      - name: run regression suite
        run: python3 -m unittest discover -s orbital_handoff/scripts/tests -v
